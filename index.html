<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>24FPS</title>
  
  <!-- Optimización PWA para iOS (iPhone 16) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="24FPS">
  <meta name="theme-color" content="#0e1115">
  <!-- Icono para pantalla de inicio en iPhone -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='115' fill='%230e1115'/%3E%3Crect x='116' y='116' width='280' height='280' rx='40' fill='none' stroke='%23222831' stroke-width='24'/%3E%3Cpath d='M180 200h152M180 256h152M180 312h100' stroke='%2300e054' stroke-width='22' stroke-linecap='round'/%3E%3Ccircle cx='340' cy='312' r='14' fill='%2300e054'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0e1115;
      color: #e5e7eb;
      -webkit-tap-highlight-color: transparent;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .poster-glow:active {
      transform: scale(0.97);
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-24 select-none">

  <!-- Header Superior -->
  <header class="sticky top-0 z-40 bg-[#0e1115]/90 backdrop-blur-md border-b border-gray-800/80 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-3 h-3 rounded-full bg-[#00e054] shadow-[0_0_10px_#00e054]"></div>
      <span class="text-xl font-extrabold tracking-tight text-white">24<span class="text-[#00e054]">FPS</span></span>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="exportData()" class="p-2 text-gray-400 hover:text-white rounded-lg bg-gray-900 border border-gray-800 text-xs font-semibold">
        Exportar
      </button>
      <label class="p-2 text-gray-400 hover:text-white rounded-lg bg-gray-900 border border-gray-800 text-xs font-semibold cursor-pointer">
        Importar
        <input type="file" accept=".json" onchange="importData(event)" class="hidden">
      </label>
    </div>
  </header>

  <!-- Buscador -->
  <section class="px-4 pt-4 pb-2">
    <div class="relative">
      <input type="text" id="searchInput" placeholder="Buscar animes..." 
        class="w-full bg-[#161a20] border border-gray-800 rounded-xl px-4 py-3 pl-11 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-[#00e054] transition-colors"
        onkeydown="if(event.key==='Enter') executeSearch()">
      <svg class="w-5 h-5 text-gray-500 absolute left-3.5 top-3.5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
    </div>
  </section>

  <!-- Vistas Principales -->
  <main class="flex-1 px-4 py-2">
    <!-- Vista 1: Explorar / Recomendados -->
    <div id="view-explore" class="space-y-4">
      <div class="flex items-center justify-between">
        <h2 id="sectionTitle" class="text-xs uppercase font-bold tracking-wider text-gray-400">Recomendados y Populares</h2>
        <span id="cacheBadge" class="hidden text-[10px] bg-emerald-950/80 text-[#00e054] border border-emerald-800/60 px-2 py-0.5 rounded-full font-medium">Carga Rápida</span>
      </div>
      <div id="animeGrid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-3">
        <!-- Render dinámico con precarga -->
      </div>
    </div>

    <!-- Vista 2: Biblioteca -->
    <div id="view-library" class="hidden space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-xs uppercase font-bold tracking-wider text-gray-400">Mi Colección</h2>
        <select id="statusFilter" onchange="renderLibrary()" class="bg-[#161a20] border border-gray-800 rounded-lg px-2.5 py-1 text-xs text-gray-300 focus:outline-none">
          <option value="ALL">Todos</option>
          <option value="WATCHING">Viendo</option>
          <option value="COMPLETED">Vistos</option>
          <option value="PLAN_TO_WATCH">Por ver</option>
          <option value="DROPPED">Abandonados</option>
        </select>
      </div>
      <div id="libraryGrid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-3"></div>
      <div id="emptyLibrary" class="hidden text-center py-16 text-gray-500 text-sm">
        Aún no has registrado ningún anime.
      </div>
    </div>

    <!-- Vista 3: Diario -->
    <div id="view-diary" class="hidden space-y-3">
      <h2 class="text-xs uppercase font-bold tracking-wider text-gray-400">Diario de Visionado</h2>
      <div id="diaryList" class="space-y-3"></div>
      <div id="emptyDiary" class="hidden text-center py-16 text-gray-500 text-sm">
        Tu diario de notas está vacío.
      </div>
    </div>
  </main>

  <!-- Modal de Detalle & Review -->
  <div id="detailModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-[#14181d] border-t sm:border border-gray-800 w-full max-w-lg rounded-t-2xl sm:rounded-2xl max-h-[90vh] flex flex-col overflow-hidden text-white">
      <div class="p-4 border-b border-gray-800 flex items-center justify-between">
        <h3 id="modalTitle" class="font-bold text-base line-clamp-1 pr-4"></h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-white p-1 text-lg">✕</button>
      </div>

      <div class="p-4 overflow-y-auto space-y-4">
        <div class="flex gap-4">
          <img id="modalPoster" src="" class="w-24 h-36 object-cover rounded-lg border border-gray-800 shadow-md">
          <div class="flex-1 space-y-1.5 text-xs text-gray-300">
            <p id="modalYear" class="text-gray-400"></p>
            <p id="modalEpisodes" class="text-gray-400"></p>
            <p id="modalGenres" class="text-[#00e054] font-medium"></p>
            <p id="modalSynopsis" class="text-gray-400 text-[11px] line-clamp-4 leading-relaxed pt-1"></p>
          </div>
        </div>

        <div class="bg-[#191e24] p-3.5 rounded-xl border border-gray-800 space-y-3.5">
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text-gray-300">Estado</span>
            <select id="entryStatus" class="bg-[#0e1115] border border-gray-800 rounded-lg px-2.5 py-1 text-xs text-white">
              <option value="WATCHING">Viendo</option>
              <option value="COMPLETED">Visto</option>
              <option value="PLAN_TO_WATCH">Por ver</option>
              <option value="DROPPED">Abandonado</option>
            </select>
          </div>

          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text-gray-300">Calificación</span>
            <div id="starContainer" class="flex gap-1 text-amber-400 text-lg cursor-pointer"></div>
          </div>

          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text-gray-300">Favorito</span>
            <button id="likeBtn" type="button" onclick="toggleLike()" class="p-2 rounded-lg bg-[#0e1115] border border-gray-800 text-gray-500 transition-colors">
              <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </button>
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1.5">Reseña o notas</label>
            <textarea id="entryReview" rows="3" placeholder="Escribe lo que pensaste de esta serie..." class="w-full bg-[#0e1115] border border-gray-800 rounded-lg p-2.5 text-xs text-white placeholder-gray-600 focus:outline-none focus:border-[#00e054]"></textarea>
          </div>
        </div>
      </div>

      <div class="p-3 border-t border-gray-800 flex gap-2">
        <button id="deleteEntryBtn" onclick="deleteCurrentEntry()" class="hidden px-4 py-2.5 rounded-xl bg-red-950/40 text-red-400 border border-red-900/60 text-xs font-bold">
          Borrar
        </button>
        <button onclick="saveCurrentEntry()" class="flex-1 py-2.5 rounded-xl bg-[#00e054] hover:bg-[#00c94b] text-black font-extrabold text-xs shadow-md transition-all">
          Guardar Registro
        </button>
      </div>
    </div>
  </div>

  <!-- Barra de Navegación Inferior -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-[#0e1115]/95 backdrop-blur-lg border-t border-gray-800/80 px-6 py-2 flex justify-around items-center">
    <button onclick="switchTab('explore')" id="tab-explore" class="flex flex-col items-center gap-1 text-[#00e054]">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
      <span class="text-[10px] font-bold">Explorar</span>
    </button>
    <button onclick="switchTab('library')" id="tab-library" class="flex flex-col items-center gap-1 text-gray-500">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
      <span class="text-[10px] font-bold">Biblioteca</span>
    </button>
    <button onclick="switchTab('diary')" id="tab-diary" class="flex flex-col items-center gap-1 text-gray-500">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <span class="text-[10px] font-bold">Diario</span>
    </button>
  </nav>

  <script>
    let currentAnime = null;
    let selectedRating = 0;
    let isFavorite = false;
    const STORAGE_KEY = 'fps24_anime_data';
    const CACHE_KEY = 'fps24_trending_cache';
    const CACHE_TIME_KEY = 'fps24_trending_time';

    function getStoredData() {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    }

    function saveStoredData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    // Consulta directa GraphQL a AniList
    async function fetchAniList(query, variables) {
      const response = await fetch('https://graphql.anilist.co', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ query, variables })
      });
      const json = await response.json();
      return json.data;
    }

    // Carga rápida con caché inmediato
    async function loadTrendingAnimes() {
      const grid = document.getElementById('animeGrid');
      const badge = document.getElementById('cacheBadge');
      
      const cached = localStorage.getItem(CACHE_KEY);
      const cacheTime = localStorage.getItem(CACHE_TIME_KEY);
      // Válido por 12 horas para ahorrar batería y datos móviles
      const isFresh = cacheTime && (Date.now() - parseInt(cacheTime) < 12 * 60 * 60 * 1000);

      // Si existe caché, lo pinta de inmediato (0ms)
      if (cached) {
        renderGrid(JSON.parse(cached), grid);
        badge.classList.remove('hidden');
        if (isFresh) return;
      }

      const query = `
        query {
          Page(page: 1, perPage: 24) {
            media(sort: TRENDING_DESC, type: ANIME) {
              id
              title { romaji english native }
              coverImage { extraLarge large }
              episodes
              seasonYear
              genres
              description(asHtml: false)
            }
          }
        }
      `;

      try {
        const data = await fetchAniList(query, {});
        const animes = data.Page.media;
        localStorage.setItem(CACHE_KEY, JSON.stringify(animes));
        localStorage.setItem(CACHE_TIME_KEY, Date.now().toString());
        renderGrid(animes, grid);
        badge.classList.remove('hidden');
      } catch (e) {
        if (!cached) {
          grid.innerHTML = '<p class="col-span-3 text-xs text-red-400 py-10 text-center">No se pudo cargar la lista. Comprueba tu conexión.</p>';
        }
      }
    }

    // Buscador
    async function executeSearch() {
      const input = document.getElementById('searchInput').value.trim();
      const grid = document.getElementById('animeGrid');
      const title = document.getElementById('sectionTitle');
      const badge = document.getElementById('cacheBadge');

      if (!input) {
        title.innerText = "Recomendados y Populares";
        loadTrendingAnimes();
        return;
      }

      badge.classList.add('hidden');
      title.innerText = `Resultados para "${input}"`;
      grid.innerHTML = '<p class="col-span-3 text-xs text-gray-500 py-8 text-center">Buscando...</p>';

      const query = `
        query ($search: String) {
          Page(page: 1, perPage: 24) {
            media(search: $search, type: ANIME) {
              id
              title { romaji english }
              coverImage { extraLarge large }
              episodes
              seasonYear
              genres
              description(asHtml: false)
            }
          }
        }
      `;

      try {
        const data = await fetchAniList(query, { search: input });
        renderGrid(data.Page.media, grid);
      } catch (err) {
        grid.innerHTML = '<p class="col-span-3 text-xs text-red-400 py-8 text-center">Sin resultados.</p>';
      }
    }

    function renderGrid(animes, container) {
      container.innerHTML = '';
      if (!animes || animes.length === 0) {
        container.innerHTML = '<p class="col-span-3 text-xs text-gray-500 py-8 text-center">No se encontraron series.</p>';
        return;
      }

      const userData = getStoredData();

      animes.forEach(anime => {
        const title = anime.title.english || anime.title.romaji;
        const entry = userData[anime.id];

        const card = document.createElement('div');
        card.className = 'poster-glow relative cursor-pointer group';
        card.onclick = () => openModal(anime);

        card.innerHTML = `
          <div class="aspect-[2/3] bg-gray-900 rounded-lg overflow-hidden border border-gray-800 relative shadow-sm">
            <img src="${anime.coverImage.large || anime.coverImage.extraLarge}" loading="lazy" class="w-full h-full object-cover">
            ${entry && entry.rating ? `
              <div class="absolute bottom-1 right-1 bg-black/80 backdrop-blur-sm px-1.5 py-0.5 rounded text-[10px] text-amber-400 font-bold flex items-center gap-0.5">
                ★ ${entry.rating}
              </div>
            ` : ''}
            ${entry && entry.favorite ? `
              <div class="absolute top-1 right-1 text-rose-500 drop-shadow">♥</div>
            ` : ''}
          </div>
          <p class="text-[11px] font-semibold text-gray-200 mt-1.5 line-clamp-2 leading-tight">${title}</p>
        `;
        container.appendChild(card);
      });
    }

    function openModal(anime) {
      currentAnime = anime;
      const userData = getStoredData();
      const entry = userData[anime.id] || { status: 'WATCHING', rating: 0, favorite: false, review: '' };

      const title = anime.title.english || anime.title.romaji;
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalPoster').src = anime.coverImage.large || anime.coverImage.extraLarge;
      document.getElementById('modalYear').innerText = anime.seasonYear ? `Año: ${anime.seasonYear}` : 'Año: N/A';
      document.getElementById('modalEpisodes').innerText = anime.episodes ? `${anime.episodes} episodios` : 'Episodios por confirmar';
      document.getElementById('modalGenres').innerText = (anime.genres || []).slice(0, 3).join(' • ');
      document.getElementById('modalSynopsis').innerText = anime.description ? anime.description.replace(/<[^>]*>?/gm, '') : 'Sin sinopsis disponible.';

      document.getElementById('entryStatus').value = entry.status;
      document.getElementById('entryReview').value = entry.review || '';
      selectedRating = entry.rating || 0;
      isFavorite = entry.favorite || false;

      updateStars();
      updateFavoriteBtn();

      const deleteBtn = document.getElementById('deleteEntryBtn');
      if (userData[anime.id]) {
        deleteBtn.classList.remove('hidden');
      } else {
        deleteBtn.classList.add('hidden');
      }

      document.getElementById('detailModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('detailModal').classList.add('hidden');
      currentAnime = null;
    }

    function setRating(val) {
      selectedRating = selectedRating === val ? 0 : val;
      updateStars();
    }

    function updateStars() {
      const container = document.getElementById('starContainer');
      container.innerHTML = '';
      for (let i = 1; i <= 5; i++) {
        const star = document.createElement('span');
        star.innerText = i <= selectedRating ? '★' : '☆';
        star.onclick = () => setRating(i);
        container.appendChild(star);
      }
    }

    function toggleLike() {
      isFavorite = !isFavorite;
      updateFavoriteBtn();
    }

    function updateFavoriteBtn() {
      const btn = document.getElementById('likeBtn');
      if (isFavorite) {
        btn.classList.add('text-rose-500', 'border-rose-900/50');
        btn.classList.remove('text-gray-500', 'border-gray-800');
      } else {
        btn.classList.remove('text-rose-500', 'border-rose-900/50');
        btn.classList.add('text-gray-500', 'border-gray-800');
      }
    }

    function saveCurrentEntry() {
      if (!currentAnime) return;
      const data = getStoredData();

      data[currentAnime.id] = {
        id: currentAnime.id,
        title: currentAnime.title,
        coverImage: currentAnime.coverImage,
        episodes: currentAnime.episodes,
        seasonYear: currentAnime.seasonYear,
        genres: currentAnime.genres,
        status: document.getElementById('entryStatus').value,
        rating: selectedRating,
        favorite: isFavorite,
        review: document.getElementById('entryReview').value.trim(),
        updatedAt: new Date().toISOString()
      };

      saveStoredData(data);
      closeModal();
      refreshActiveViews();
    }

    function deleteCurrentEntry() {
      if (!currentAnime) return;
      const data = getStoredData();
      delete data[currentAnime.id];
      saveStoredData(data);
      closeModal();
      refreshActiveViews();
    }

    function renderLibrary() {
      const filter = document.getElementById('statusFilter').value;
      const data = getStoredData();
      const grid = document.getElementById('libraryGrid');
      const empty = document.getElementById('emptyLibrary');

      let list = Object.values(data);
      if (filter !== 'ALL') {
        list = list.filter(item => item.status === filter);
      }

      if (list.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }

      empty.classList.add('hidden');
      renderGrid(list, grid);
    }

    function renderDiary() {
      const data = getStoredData();
      const list = Object.values(data)
        .filter(i => i.review || i.rating)
        .sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));

      const container = document.getElementById('diaryList');
      const empty = document.getElementById('emptyDiary');

      if (list.length === 0) {
        container.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }

      empty.classList.add('hidden');
      container.innerHTML = '';

      list.forEach(entry => {
        const item = document.createElement('div');
        item.className = 'bg-[#14181d] border border-gray-800/80 rounded-xl p-3 flex gap-3 cursor-pointer';
        item.onclick = () => openModal(entry);

        const stars = entry.rating ? '★'.repeat(entry.rating) + '☆'.repeat(5 - entry.rating) : '';
        const dateStr = new Date(entry.updatedAt).toLocaleDateString('es-ES', { month: 'short', day: 'numeric' });

        item.innerHTML = `
          <img src="${entry.coverImage.large}" class="w-14 h-20 object-cover rounded-md border border-gray-800">
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between">
              <h4 class="text-xs font-bold text-white line-clamp-1">${entry.title.english || entry.title.romaji}</h4>
              <span class="text-[10px] text-gray-500">${dateStr}</span>
            </div>
            <div class="text-amber-400 text-xs my-0.5">${stars}</div>
            ${entry.review ? `<p class="text-[11px] text-gray-400 line-clamp-2 italic mt-1">"${entry.review}"</p>` : ''}
          </div>
        `;
        container.appendChild(item);
      });
    }

    function switchTab(tab) {
      document.getElementById('view-explore').classList.add('hidden');
      document.getElementById('view-library').classList.add('hidden');
      document.getElementById('view-diary').classList.add('hidden');

      document.getElementById('tab-explore').className = 'flex flex-col items-center gap-1 text-gray-500';
      document.getElementById('tab-library').className = 'flex flex-col items-center gap-1 text-gray-500';
      document.getElementById('tab-diary').className = 'flex flex-col items-center gap-1 text-gray-500';

      document.getElementById(`view-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).className = 'flex flex-col items-center gap-1 text-[#00e054]';

      if (tab === 'library') renderLibrary();
      if (tab === 'diary') renderDiary();
    }

    function refreshActiveViews() {
      renderLibrary();
      renderDiary();
      const currentTab = document.getElementById('view-explore').classList.contains('hidden') ? 
        (document.getElementById('view-library').classList.contains('hidden') ? 'diary' : 'library') : 'explore';
      if (currentTab === 'explore') loadTrendingAnimes();
    }

    function exportData() {
      const data = localStorage.getItem(STORAGE_KEY) || '{}';
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `24fps_backup_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          JSON.parse(e.target.result);
          localStorage.setItem(STORAGE_KEY, e.target.result);
          refreshActiveViews();
          alert('¡Datos restaurados con éxito en 24FPS!');
        } catch (err) {
